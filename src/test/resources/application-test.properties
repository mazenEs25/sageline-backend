spring.application.name=SageLine-test
# Datasource URL/user/pass are set per-test via @DynamicPropertySource in PostgresTestcontainer.
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate owns the schema in tests (Flyway is disabled below). The catalog
# table is created from the entity definition; the partial unique index and the
# seed data are layered on programmatically by PostgresTestcontainer.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway disabled in tests. Rationale:
#   - A fresh Testcontainers DB has none of the legacy Hibernate-generated tables,
#     so the V1.0 baseline + baseline-on-migrate flow does not apply.
#   - Tests bootstrap the catalog schema via Hibernate and apply the catalog
#     migration deltas (partial index, seed) programmatically.
spring.flyway.enabled=false

# Keycloak issuer left at the dev URL; tests that exercise security use mock
# JWTs (Spring Security Test) rather than real Keycloak.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/sageline
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/sageline/protocol/openid-connect/certs

server.port=0
ai.service.url=http://localhost:5000

# Phase 004 log importer — tests write to target/test-storage; cleaned by `mvn clean`.
sageline.import.storage-root=target/test-storage
sageline.import.snippet-lines=12
sageline.import.max-file-size=2MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Keycloak admin client config — values are present so @Value placeholders resolve;
# tests don't actually connect to Keycloak.
keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=sageline
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin
