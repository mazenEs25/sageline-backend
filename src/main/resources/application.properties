spring.application.name=SageLine
# DB Configuration :
spring.datasource.url=jdbc:postgresql://localhost:5432/sageLine_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Web Server (Tomcat) configuration :
server.port=8089
# AI Service Configuration
ai.service.url=http://localhost:5000
# ─── Keycloak / OAuth2 Resource Server ───
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/sageline
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/sageline/protocol/openid-connect/certs
# ─── Keycloak Admin Client ───
keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=sageline
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin