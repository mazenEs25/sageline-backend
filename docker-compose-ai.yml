services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: sageline-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # API REST (pour Flask et l'UI web)
      - "6334:6334"  # API gRPC (plus rapide, optionnel)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Logs en mode INFO (passe en DEBUG si tu veux voir toutes les requêtes)
      - QDRANT__LOG_LEVEL=INFO
      # Performance tuning
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
    networks:
      - sageline-ai-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
    name: sageline_qdrant_data
    driver: local

networks:
  sageline-ai-network:
    name: sageline-ai-network
    driver: bridge